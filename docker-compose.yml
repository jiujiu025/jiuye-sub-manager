services:
  api:
    build: ./backend
    container_name: sub-manager-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/sub_manager.db
    volumes:
      - sub_manager_data:/app/data
      - sub_manager_logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sub-manager-nginx
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${ACME_CHALLENGE_DIR:-./acme-challenge}:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'if [ "$$APP_ENV" = "production" ]; then wget --no-check-certificate -q --spider https://127.0.0.1/healthz; else wget -q --spider http://127.0.0.1/healthz; fi']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sub_manager_data:
  sub_manager_logs:
