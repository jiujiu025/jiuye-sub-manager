services:
  api:
    build: ./backend
    container_name: sub-manager-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/sub_manager.db
    volumes:
      - sub_manager_data:/app/data
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sub-manager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  sub_manager_data:
